<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/inicio" aria-label="Brasil Decide 2026 — início">
      <span class="brand-title">Brasil Decide <strong>2026</strong></span>
    </a>
    <a class="settings-link" routerLink="/ajuda" aria-label="Abrir configurações de acessibilidade">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.07A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.01V3a2 2 0 1 1 4 0v.07a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.07A1.7 1.7 0 0 0 19.4 15Z" />
      </svg>
    </a>
  </div>
</header>

@if (latestNotification(); as alert) {
  <aside class="official-alert-banner" role="alert">
    <div>
      <strong>{{ alert.title }}</strong>
      <p>{{ alert.details }}</p>
      <a routerLink="/alertas" (click)="dismissAlert(alert.id)">Abrir tela de alertas</a>
    </div>
    <button type="button" aria-label="Dispensar aviso" (click)="dismissAlert(alert.id)">Fechar</button>
  </aside>
}

<main id="conteudo" class="page-container" tabindex="-1">
  <router-outlet />
</main>

<nav class="bottom-nav" aria-label="Navegação principal">
  @for (item of navigationItems; track item.path) {
    <a
      class="bottom-nav-link"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        @switch (item.icon) {
          @case ('home') {
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" />
          }
          @case ('chart') {
            <path d="M4 19V12h4v7H4Zm6 0V5h4v14h-4Zm6 0V9h4v10h-4Z" />
          }
          @case ('bell') {
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" />
          }
          @case ('help') {
            <circle cx="12" cy="12" r="9" />
            <path d="M9.6 9a2.5 2.5 0 1 1 4.7 1.2c-.8 1.2-2.3 1.4-2.3 3.3M12 17h.01" />
          }
        }
      </svg>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
