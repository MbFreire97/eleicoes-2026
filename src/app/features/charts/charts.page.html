<section class="feature-page" aria-labelledby="charts-title">
  <h1 id="charts-title" class="visually-hidden">Gráficos da apuração</h1>

  @if (snapshot(); as election) {
    <p class="visually-hidden">{{ sourceNote() }}</p>
    <app-election-charts [snapshot]="election" [detailed]="true" />
  } @else if (isLoading()) {
    <p class="state-message" role="status">Consultando dados da eleição...</p>
  } @else {
    <p class="state-message state-message--error" role="alert">
      {{ errorMessage() ?? 'Os gráficos ainda não têm dados disponíveis.' }}
    </p>
  }
</section>
