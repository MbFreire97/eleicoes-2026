name: Build and publish Brasil Decide 2026

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watch=false

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Derivar o caminho base do site
        id: base-path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ -z "$PAGES_BASE_PATH" ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="${PAGES_BASE_PATH%/}/"
          fi
          echo "value=$BASE_HREF" >> "$GITHUB_OUTPUT"

      - name: Compilar para o caminho do GitHub Pages
        run: npm run build -- --base-href "${{ steps.base-path.outputs.value }}"

      - name: Preparar recarregamento das rotas do Angular
        run: npm run prepare:pages -- dist/brasil-decide-2026/browser "${{ steps.base-path.outputs.value }}"

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/brasil-decide-2026/browser

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
